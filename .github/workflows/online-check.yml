name: Online check

# Checks the outside services online play depends on (room server, relay
# servers) and runs a host + guest join against the live site.
on:
  workflow_dispatch:
  push:
    branches: [claude/island-traders-seafarers-rh48ru]
    paths: [scripts/online-check.mjs, .github/workflows/online-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Local TURN server (checks the check)
        run: |
          sudo apt-get install -y coturn >/dev/null
          ip=$(hostname -I | awk '{print $1}')
          sudo turnserver -n -o --lt-cred-mech --user=test:test --realm=check --listening-port=3478 --listening-ip="$ip" --relay-ip="$ip" --no-tls --no-dtls --log-file=stdout >/dev/null
          echo "LOCAL_TURN=$ip" >> "$GITHUB_ENV"
      - run: node scripts/online-check.mjs
